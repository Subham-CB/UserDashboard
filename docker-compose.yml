version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: userdashboard-db
    environment:
      POSTGRES_DB: userdashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: userdashboard-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=userdashboard;Username=postgres;Password=postgres
      - Jwt__Key=your-super-secret-jwt-key-that-is-at-least-32-characters-long
      - Jwt__Issuer=UserDashboard
      - Jwt__Audience=UserDashboard
      - Cors__AllowedOrigins__0=http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: userdashboard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
